name: spell-check-beta

services:
  api:
    container_name: spell-check-beta-api
    build: ./backend
    env_file: .env
    environment:
      LOCAL_STORAGE_PATH: /app/tmp
      API_PUBLIC_URL: http://localhost:8010
      USE_PYMUPDF: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./tmp:/app/tmp

  worker:
    container_name: spell-check-beta-worker
    build: ./backend
    env_file: .env
    environment:
      LOCAL_STORAGE_PATH: /app/tmp
      USE_PYMUPDF: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m app.worker
    volumes:
      - ./tmp:/app/tmp
    depends_on:
      - api

  web:
    container_name: spell-check-beta-web
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8010
        VITE_MOCK: ${VITE_MOCK:-0}
    ports:
      - "5183:80"
